<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Monitor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 p-6 text-slate-100 antialiased">
<div class="w-full max-w-md">
    <a href="/app/" class="mb-6 flex items-center justify-center gap-2 text-xl font-semibold tracking-tight">
        <span class="h-2.5 w-2.5 rounded-full bg-cyan-400"></span>
        AI Monitor
    </a>

    {% include "web/_flashes.html" %}

    {% if error is defined and error %}
        <div class="mb-4 rounded-lg border border-rose-700 bg-rose-950 px-4 py-2 text-sm text-rose-200">
            {{ error }}
        </div>
    {% endif %}

    <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
        <h1 class="text-lg font-semibold">{% block heading %}{% endblock %}</h1>
        <p class="mt-1 text-sm text-slate-400">{% block lead %}{% endblock %}</p>
        {% block card %}{% endblock %}
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">{% block footnote %}{% endblock %}</p>
</div>
</body>
</html>
