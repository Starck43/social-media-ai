[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-ai-local-connector"
version = "0.1.0"
description = "Standalone selected-folder desktop connector core"
requires-python = ">=3.11"
dependencies = ["watchdog>=4.0"]

[tool.setuptools]
packages = ["local_connector"]

[tool.setuptools.package-dir]
local_connector = "."

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
