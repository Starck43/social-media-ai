{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="col-12 col-md-8 col-lg-6">
    <div class="card">
        <div class="card-status-top bg-warning"></div>
        <div class="card-header">
            <h3 class="card-title">{{ title }}</h3>
        </div>
        <div class="card-body">
            <p>{{ message }}</p>
            <form method="post" action="{{ action_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="pks" value="{{ pks }}">
                {% for field in fields %}
                <div class="mb-3">
                    <label class="form-label" for="action-field-{{ field.name }}">{{ field.label }}</label>
                    <input class="form-control" id="action-field-{{ field.name }}" name="{{ field.name }}"
                        type="{{ field.type | default('text') }}" value="{{ field.value | default('') }}"
                        placeholder="{{ field.placeholder | default('') }}"
                        {% if field.required %}required{% endif %}>
                    {% if field.hint %}<small class="form-hint">{{ field.hint }}</small>{% endif %}
                </div>
                {% endfor %}
                <div class="d-flex">
                    {% if cancel_url %}<a class="btn" href="{{ cancel_url }}">Отмена</a>{% endif %}
                    <button type="submit" class="btn btn-primary ms-auto">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
