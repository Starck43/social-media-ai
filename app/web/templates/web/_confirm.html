{# One confirmation shell per /app page; callers provide text through data-confirm. #}
<style>
    .ui-confirm-dialog { width: min(28rem, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem); }
    .ui-confirm-dialog::backdrop { background: rgb(2 6 23 / 60%); }
    .dark .ui-confirm-dialog::backdrop { background: rgb(2 6 23 / 80%); }
</style>
<dialog id="ui-confirm" aria-labelledby="ui-confirm-title" aria-describedby="ui-confirm-message"
        class="ui-confirm-dialog rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-6 text-slate-900 dark:text-slate-100 shadow-2xl">
    <h2 id="ui-confirm-title" class="text-lg font-semibold text-rose-700 dark:text-rose-300"></h2>
    <p id="ui-confirm-message" class="mt-2 whitespace-pre-line break-words text-sm text-slate-600 dark:text-slate-400"></p>
    <div class="mt-5 flex flex-wrap justify-end gap-2">
        <button type="button" data-confirm-cancel autofocus
                class="rounded-lg border border-slate-300 dark:border-slate-700 px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800">Отмена</button>
        <button type="button" data-confirm-accept
                class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500">Подтвердить</button>
    </div>
</dialog>
