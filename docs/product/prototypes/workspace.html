    '<p class="meta">'+esc([shortDue(draft.due),draft.owner,sourceSummary(draft),draft.sources.length&&draft.scenario,draft.sources.length&&draft.repeat,draft.sources.length&&draft.repeat&&draft.at].filter(Boolean).join(' · '))+'</p>'
 }else if(step==='timing'){
  body=selectField('dateChoice','К какому дню нужно закончить?',['Без срока','Сегодня','Завтра','Выбрать дату'],draft.dateChoice)+
   (draft.dateChoice==='Выбрать дату'?input('due','Дата дедлайна','date','required'):'')+
   (draft.dateChoice!=='Без срока'?input('time','Время дедлайна, если важно','time'):'')+
   '<label><input type="checkbox" class="check" data-field="important" '+(draft.important?'checked':'')+'> Важная задача</label>'
 }else if(step==='people'){
  body=selectField('owner','Кто отвечает за результат?',['Я','Ирина'],draft.owner)
 }else if(step==='platform'){
  body=platformEditor()
 }else if(step==='scenario'){
  body=input('scenarioTitle','Название сценария','text','required maxlength="100"')+
   field('instructions','Что агент должен сделать с собранными данными?','<textarea id="f-instructions" data-field="instructions" rows="4" required>'+esc(draft.instructions||'')+'</textarea>')
 }else{
  const sourceChoice=(id,label,detail)=>'<label class="source-choice"><input class="check" type="checkbox" data-source-id="'+id+'" '+(draft.sources.includes(id)?'checked':'')+'><span>'+esc(label)+'<small class="meta">'+esc(detail)+'</small></span></label>'
  body='<h3>Откуда собрать данные?</h3><p class="meta">Можно выбрать несколько источников.</p><fieldset><legend>Подключения пространства</legend>'+
   connections.map(([id,group,name])=>sourceChoice(id,group,name)).join('')+'</fieldset>'+
   sourceChoice('web','Интернет','Открытые сайты · без подключения')
  if(draft.sources.length){
   const picks={vk:'Мониторинг VK',tg:'Обзор обсуждений',mail:'Разбор почты',disk:'Подготовка предложения'}
   const suggested=[...new Set(draft.sources.map(id=>picks[id]).filter(Boolean))]
   const available=[...scenarios.keys()].filter(name=>!suggested.includes(name))
   if(draft.pendingScenario)available.push(draft.pendingScenario.name)
   body+=field('scenario','Подключить сценарий агента?','<select id="f-scenario" data-field="scenario"><option value="">Только собрать данные</option>'+(suggested.length?'<optgroup label="Для выбранных источников">'+options(suggested,draft.scenario)+'</optgroup>':'')+options(available,draft.scenario)+'</select>')+
    (draft.scenario?'<p class="meta">'+esc(scenarios.get(draft.scenario)||draft.pendingScenario?.instructions||'')+'</p>':'')+
    btn('Создать сценарий','step:scenario')
   if(withPlatform(draft))body+='<button type="button" class="editor-block" data-cmd="step:platform"><b>Настроить выборку и анализ →</b><small>'+esc(platformSummary(draft))+'</small></button>'
   body+=selectField('repeat','Когда запускать?',['По запросу','Ежедневно','По будням','Еженедельно'],draft.repeat||'По запросу')
   if(draft.repeat){
    if(draft.repeat==='Еженедельно')body+=selectField('weekday','В какой день?',weekdays,weekdays[draft.weekday??1])
    body+=input('at','Время запуска · '+Intl.DateTimeFormat().resolvedOptions().timeZone,'time','required')
   }
  }
 }
 show(draft.agentMode?'Настроить поручение':newItem?'Новая задача':'Изменить задачу','<form id="wizard">'+body+'<div class="actions editor-footer">'+(step==='main'?'<button class="btn primary">Сохранить задачу</button>':'<button class="btn primary">'+(step==='scenario'?'Применить сценарий':'Готово')+'</button>')+'</div></form>',true)
 const savedStep=step
 currentPanel=()=>{step=savedStep;editor()}
}
function updateDraft(el){
 const k=el.dataset.field
 if(!k)return
 el.setCustomValidity('')
 draft[k]=el.type==='checkbox'?el.checked:el.value
 if(k==='dateChoice'){draft.due=({'Сегодня':todayKey,'Завтра':tomorrow}[el.value]||'');if(!draft.due)draft.time=''}
 if(k==='commitment'&&draft.commitment&&!draft.due){draft.dateChoice='Выбрать дату';step='timing';editor()}
 if(k==='repeat'){if(el.value==='По запросу')draft.repeat='';else{draft.at ||= '09:00';draft.weekday??=1}}
 if(k==='weekday')draft.weekday=weekdays.indexOf(el.value)
}
function finishEditor(){
 if(withPlatform(draft)&&['platform','main'].includes(step)){
  let invalid=''
  if(draft.windowMode==='Даты'){
   if(!draft.windowStart)invalid='windowStart'
   else if(!draft.windowEnd||draft.windowEnd<draft.windowStart)invalid='windowEnd'
  }else if(!Number.isInteger(Number(draft.windowDays))||draft.windowDays<1||draft.windowDays>365)invalid='windowDays'
  if(invalid){step='platform';editor();$('f-'+invalid).reportValidity();return}
 }
 if(step==='scenario'){
  const name=(draft.scenarioTitle||'').trim(), instructions=(draft.instructions||'').trim()
  if(!name||scenarios.has(name)){
   const title=$('f-scenarioTitle');title.setCustomValidity(name?'Такой сценарий уже есть. Выберите другое название.':'Укажите название сценария.');title.reportValidity();return
  }
  if(!instructions){$('f-instructions').setCustomValidity('Опишите действия агента.');$('f-instructions').reportValidity();return}
  draft.pendingScenario={name,instructions};draft.scenario=name;step='automation';editor();return
 }
 if(step==='automation'&&!draft.sources.length){draft.scenario='';draft.repeat=''}
 if(step!=='main'){goBack();return}
 if(draft.commitment&&!draft.due&&step==='main'&&draft.title.trim()){draft.dateChoice='Выбрать дату';step='timing';editor();$('f-due').focus();return}
 if(!draft.title.trim()){step='main';editor();$('f-title').focus();return}
 if(draft.dateChoice==='Выбрать дату'&&!draft.due){step='timing';editor();$('f-due').reportValidity();return}
 if(draft.sources.length&&draft.repeat&&!draft.at){step='automation';editor();$('f-at').reportValidity();return}
 const {dateChoice,agentMode,pendingScenario,scenarioTitle,instructions,...data}=draft
 data.title=data.title.trim()
 if(!withPlatform(data)){
  for(const key of ['windowMode','windowDays','windowStart','windowEnd','collectionGoal','sourceScope','discovery','authors','phrases','phraseMatch','brands','resultBrief'])data[key]=null
 }else{
  if(data.sourceScope!=='Поиск сообществ по теме')data.discovery=''
  if(data.windowMode!=='Даты'){data.windowStart='';data.windowEnd=''}else data.windowDays=null
  if(data.scenario!=='Мониторинг VK')data.brands=''
  if(!data.scenario){data.phrases='';data.phraseMatch='';data.resultBrief=''}
 }
 if(!data.sources.length){data.scenario='';data.repeat=''}
 if(pendingScenario&&data.scenario===pendingScenario.name)scenarios.set(pendingScenario.name,pendingScenario.instructions)
 editorDrafts.delete(data.id?'task:'+data.id:'new:'+(data.source||0))
 returnPath=[]
 let t=taskData.find(t=>t.id===data.id)
 if(t)Object.assign(t,data)
 else{t={...data,id:Date.now()};taskData.push(t);activeFilters.clear();scope='Все';calendarView=false;location.hash='tasks'}
 render();detail(t)
}
function detail(t){
 const source=threads.find(x=>x.id===t.source)
 show('Карточка задачи','<div class="tags">'+chips(t)+'</div><label for="quick-title">Название</label><input id="quick-title" required maxlength="160" data-quick="title" data-id="'+t.id+'" value="'+esc(t.title)+'"><label for="quick-note">Описание</label><textarea id="quick-note" rows="4" data-quick="note" data-id="'+t.id+'">'+esc(t.note||'')+'</textarea><small class="meta">Название и описание сохраняются при выходе из поля.</small><p class="meta">Исполнитель · '+esc(t.owner)+'</p>'+
  (runnable(t)?'<div class="evidence"><b>Источники данных</b><p>'+esc(sourceSummary(t))+'</p><small>'+esc(t.scenario?'Сценарий · '+t.scenario:'Только сбор данных')+'</small>'+(withPlatform(t)?'<p class="meta">'+esc(platformSummary(t))+'</p>':'')+'</div>':'')+
  (source?'<div class="evidence"><b>'+(t.commitment?'Договорённость с клиентом':'Источник')+'</b><p>'+source.name+' · '+source.channel+'</p>'+btn('Открыть переписку','thread:'+source.id)+'</div>':'')+
  '<div class="actions">'+btn('Изменить задачу','edit:'+t.id,true)+taskActions(t)+(!t.closed&&runnable(t)?btn('Запустить сейчас','run:'+t.id):'')+(t.id===3&&pending()?btn('Согласовать','review'):'')+closeButton(t)+'</div>',true)
 currentPanel=()=>detail(t)
}
function act(cmd){
 const [action,value]=cmd.split(':')
 const id=Number(value), t=taskData.find(x=>x.id===id)
 switch(action){
 case 'return': goBack();break
 case 'global': $('modal').close();location.hash='chat';break
 case 'respond': quickReply(id);break
 case 'warnings': $('connections').focus();$('connections').scrollIntoView({behavior:'smooth',block:'center'});break
 case 'auth': show('Вход в Telegram','<p>В рабочем пространстве откроется авторизация подключения «Рабочий чат». После входа сбор можно повторить.</p>'+btn('Завершить демонстрационный вход','authenticated',true));break
 case 'authenticated': {
  tgNeedsLogin=false;const resume=resumeAfterAuth;resumeAfterAuth=null;returnPath=[]
  render();if(resume){resume()}else{$('modal').close();$('connections')?.focus()}break
 }
 case 'archive': show('Подключить папку «Архив»?','<p>Рабочая почта · разрешить чтение сообщений из архивной папки.</p>'+btn('Подключить в демо','archiveConnected',true));break
 case 'archiveConnected': archiveConnected=true;$('modal').close();render();$('connections')?.focus();break
 case 'receipt': {
  const run=runs.find(r=>r.stamp.getTime()===id)
  if(!run)break
  show('Результат запуска','<span class="tag">'+esc(run.status)+'</span><h3>'+esc(run.title)+'</h3><p>'+niceDate(dayKey(run.stamp))+' · '+localTime(run.stamp)+' · '+esc(run.source||'')+'</p><p>'+esc(run.detail)+'</p><div class="actions">'+btn('Открыть задачу →','task:'+run.task)+delegateButton(taskData.find(t=>t.id===run.task))+(run.stamp===lastMorning&&pending()?btn('Согласовать отправку','review',true):'')+'</div>',true)
  break
 }
 case 'task': detail(t);break
 case 'edit': startEditor(0,t);break
 case 'guided': startEditor(0,t,true);break
 case 'step': step=value;editor();break
 case 'month': month=id?new Date(month.getFullYear(),month.getMonth()+id,1):new Date(clock.getFullYear(),clock.getMonth(),1);render();break
 case 'view': calendarView=Boolean(id);render();break
 case 'closeTask':
  if(!t.closed){
   render();show('Закрыть задачу?', '<h3>'+esc(t.title)+'</h3><p>'+(t.repeat?'Будущие запуски по расписанию прекратятся. История выполнений сохранится.':'Задача появится среди закрытых. Её можно открыть снова.')+'</p>'+btn('Закрыть задачу','confirmClose:'+id,true)+' '+btn('Отмена','return'));break
  }
  setClosed(t,!t.closed);break
 case 'confirmClose': returnPath=[];setClosed(t,true);break
 case 'run':
  if(t.sources?.includes('tg')&&tgNeedsLogin){resumeAfterAuth=()=>detail(t);show('Требуется вход в Telegram','<p>Обновите подключение и повторите запуск.</p>'+btn('Войти повторно','auth'));break}
  show('Запустить сейчас?', '<p>'+esc(t.title)+'</p><p>'+esc(processing(t))+(t.repeat?' · следующий запуск по расписанию сохранится.':'.')+'</p>'+btn('Запустить','confirmRun:'+id,true));break
 case 'confirmRun':
  runs.unshift({task:id,title:t.title,source:sourceSummary(t),scenario:t.scenario,status:'Выполнено',detail:'Ручной запуск · деморезультат',scheduled:false,stamp:new Date()})
  render();show('Выполнено','<p>'+esc(t.title)+' · деморезультат ручного запуска</p>'+btn('К задаче','task:'+id));break
 case 'agent': if(canDelegate(t))agent(t);break
 case 'later': t.due=tomorrow;$('modal').close();render();show('Отложено до завтра','<p>'+esc(t.title)+' · '+niceDate(tomorrow)+'</p>'+btn('Вернуть на сегодня','undo:'+id));break
 case 'undo': t.due=todayKey;$('modal').close();render();break
 case 'filter':
  if(value==='Все')activeFilters.clear()
  else if(activeFilters.has(value))activeFilters.delete(value)
  else activeFilters.add(value)
  render()
  document.querySelector('[data-cmd="filter:'+value+'"]').focus()
  break
 case 'day':
  show(niceDate(value),'<div class="day-list">'+calendarEntries(value,visibleTasks()).map(entryButton).join('')+'</div>',true)
  break
 case 'new': startEditor();break
 case 'from': startEditor(id);break
 case 'thread': threadId=id;$('modal').close();location.hash='mail';render();break
 case 'review': review();break
 case 'approve': case 'decline': decision=action==='approve'?'Согласовано':'Отклонено';$('modal').close();render();break
 case 'event': show('Встреча по макетам','<p class="tag">Яндекс Календарь</p><p>'+niceDate(todayKey)+' · 10:00–10:30</p><p>Обсуждение вариантов обложки с командой студии.</p>',true);break
 case 'send':
  if(id===2&&tgNeedsLogin){resumeAfterAuth=()=>quickReply(id);show('Telegram требует входа','<p>Черновик ответа сохранён.</p>'+btn('Войти повторно','auth'));break}
  (replies[id]??=[]).push(drafts[id]);drafts[id]='';$('modal').close();render();break
 }
}
function goBack(){
 if($('wizard')&&step!=='main'){step=['scenario','platform'].includes(step)?'automation':'main';editor();return}
 const restore=returnPath.pop()
 if(restore)restore();else $('modal').close()
}
$('panelBack').onclick=goBack
$('modal').addEventListener('close',()=>{if(!$('modal').open){returnPath=[];currentPanel=null}})
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-cmd]')
 if(!el)return
 const action=el.dataset.cmd.split(':')[0]
 if(!el.closest('dialog')){returnPath=[];resumeAfterAuth=null}
 else if(['edit','guided','agent','task','review','run','closeTask','auth'].includes(action)&&currentPanel)returnPath.push(currentPanel)
 act(el.dataset.cmd)
})
document.addEventListener('input',e=>{if(e.target.dataset.field && e.target.tagName!=='SELECT'&&e.target.type!=='checkbox')updateDraft(e.target);if(e.target.dataset.reply)drafts[e.target.dataset.reply]=e.target.value;if(e.target.dataset.chat)chatDrafts[e.target.dataset.chat]=e.target.value;if(e.target.id==='answer')drafts[threadId]=e.target.value})
document.addEventListener('submit',e=>{
 e.preventDefault()
 if(e.target.id==='wizard'){finishEditor()}else if(e.target.id==='agentForm'){
  const key=e.target.dataset.id,note=$('instruction').value.trim();if(!note)return
  const history=chats[key]??=[]
  history.push({mine:true,text:note},{mine:false,text:key==='main'?'Сообщение принято в общем чате.':'Поручение записано. Обсуждение можно продолжить в этой задаче.'})
  chatDrafts[key]='';try{sessionStorage.setItem('studio-demo-chats',JSON.stringify(chats))}catch{}
  if(key==='main')render();else agent(taskData.find(t=>t.id===Number(key)))
 }else if(e.target.id==='quickReply'){
  const id=Number(e.target.dataset.id),message=$('replyText').value.trim()
  if(!message)return
  if(id===2&&tgNeedsLogin){resumeAfterAuth=()=>quickReply(id);show('Telegram требует входа','<p>Черновик ответа сохранён.</p>'+btn('Войти повторно','auth'));returnPath.push(()=>quickReply(id));return}
  ;(replies[id]??=[]).push(message);drafts[id]='';$('modal').close();render()
 }else if(e.target.id==='reply'){
  const text=$('answer').value.trim();if(!text)return
  drafts[threadId]=text
  const t=threads.find(t=>t.id===threadId)
  show('Согласовать ответ?', '<p class="meta">'+t.name+' · '+t.channel+'</p><p class="bubble">'+esc(text)+'</p>'+btn('Согласовать ответ','send:'+threadId,true))
 }
})
document.addEventListener('change',e=>{
 const el=e.target
 if(el.dataset.sourceId){
  const id=el.dataset.sourceId
  draft.sources=el.checked?[...draft.sources,id]:draft.sources.filter(x=>x!==id)
  editor()
  document.querySelector('[data-source-id="'+id+'"]').focus()
  return
 }
 if(el.id==='scope'){scope=el.value;render();return}
 if(el.dataset.quick){
  const t=taskData.find(x=>x.id===Number(el.dataset.id))
  if(el.dataset.quick==='title'&&!el.value.trim()){el.value=t.title;return}
  t[el.dataset.quick]=el.value.trim();const copy=editorDrafts.get('task:'+t.id);if(copy)copy[el.dataset.quick]=t[el.dataset.quick];render();return
 }
 if(el.dataset.field&&(el.tagName==='SELECT'||el.type==='checkbox')){
  updateDraft(el)
  if(['scenario','repeat','dateChoice','windowMode','sourceScope'].includes(el.dataset.field))editor()
 }
})
window.addEventListener('hashchange',render)
appearance();render()
</script></body></html>
