name = "routine-worker"
description = "Codex delegation wrapper for bounded OpenCode implementation tasks; not a test runner."
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Read AGENTS.md and the selected task card; record actual docs read/checks.
Consult only relevant COLLABORATION sections. Load
.agents/skills/opencode-task/SKILL.md. Delegate only bounded implementation
through OpenCode build pinned to qwenplan/deepseek-v4.1-flash-1017. Run from the target checkout;
this CLI does not accept --dir. Never execute the task or pytest here. Persist
the result and delete child sessions after dialogue. Do not spawn other external
providers, commit, push, merge or edit unowned files.
"""
[sandbox_workspace_write]
network_access = true
writable_roots = ["/Users/admin/.local/share/opencode", "/Users/admin/.config/opencode", "/Users/admin/.npm"]
