name: Test and reference navigation

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned core only (no test fixtures or services)
        run: python -m pip install -r requirements.txt
      - name: Prove metadata execution guards fail closed
        run: python -I scripts/reference/probe.py --guard-check
      - name: Check deterministic OpenAPI and Typer tables
        run: python scripts/reference/generate.py --check
      - name: Render synthetic templates without application imports
        run: python -I tests/tooling/test_p11_t16_fixture_rendering.py
      - name: Pure JS contracts from outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          node --test "$GITHUB_WORKSPACE/tests/js/web_confirm.test.cjs"
          node "$GITHUB_WORKSPACE/tests/js/web_shell_state.cjs"
      - name: Install explicit dev profile for collection only
        run: python -m pip install -r requirements/dev.txt
      - name: Guarded discovery of reviewed synthetic-source suites (not DB execution)
        run: python -I tests/tooling/test_p11_t16_discovery.py
