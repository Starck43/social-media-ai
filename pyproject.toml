[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-ai"
dynamic = ["version"]
description = "AI Assistant for evidence-backed research and controlled workflows"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Communications :: Social Media",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "fastapi-pagination==0.16.1",
    "slowapi==0.1.10",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "psycopg2-binary==2.9.13",
    "psycopg[binary]==3.3.6",
    "PyJWT==2.15.1",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "cryptography==50.0.2",
    "typer==0.27.3",
    "rich==15.0.0",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "email-validator==2.3.0",
    "itsdangerous==2.2.0",
    "croniter==6.2.4",
    # Active SlowAPI storage constructs the Redis backend at import time.
    "redis==8.1.0",
    "sqladmin==0.32.0",
]

[project.optional-dependencies]
legacy-celery = ["celery==5.6.3"]
telegram = ["telethon==1.45.0"]
qr = ["segno==1.6.6"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "aiosqlite==0.22.1",
    "black==25.1.0",
    "isort==6.0.1",
    "mypy==2.4.0",
    "flake8==7.4.1",
]

[project.scripts]
cli = "cli.main:app"

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "cli", "cli.*"]
# cli/commands has no __init__.py and is an implicit namespace package.
namespaces = true
exclude = ["app.static*", "app.templates*", "app.web.templates*"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/**/*", "web/templates/**/*"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
# All async tests/fixtures share a single event loop. The SQLAlchemy async
# engine pool keeps connections bound to the loop that created them, so a
# per-test loop makes the next test fail with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v --cov=app --cov-report=term-missing"
markers = [
    "tenancy: test runs without the platform-owner bypass and asserts tenant isolation",
]

[project.urls]
Homepage = "https://github.com/Starck43/social-media-ai"
Documentation = "https://github.com/Starck43/social-media-ai#readme"
Issues = "https://github.com/Starck43/social-media-ai/issues"
