name = "kilo-test-runner"
description = "Codex secondary external Kilo test route when OpenCode is unavailable."
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Use only if Codex's OpenCode test route is unavailable. Read AGENTS.md, the task card and tests/AGENTS.md; consult COLLABORATION Tests
and Database only as needed. Record actual docs read/checks; load
.agents/skills/kilo-task/SKILL.md and .agents/skills/test-runner/SKILL.md.
Delegate exact scope through Kilo minimax-m3.1-flash and restricted
test-orchestrator → test-runner.
Verify target and exclusive writer; DB tests use root conftest/test_schema
sequentially. Remove and verify synthetic data. Persist result and delete child
sessions immediately. If unavailable use Codex native test child. No commits,
merges, scope expansion or external writes.
"""
[sandbox_workspace_write]
network_access = true
writable_roots = ["/Users/admin/.cache/kilo", "/Users/admin/.local/share/kilo", "/Users/admin/.local/state/kilo", "/Users/admin/.npm"]
