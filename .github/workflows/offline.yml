name: Offline safety net

on:
  push:
    # Owner request 2026-10-28: agent branches push once per commit and the
    # resulting failure mail is noise while nothing is deployed. GitHub forbids
    # combining branches with branches-ignore, so the eligibility is expressed
    # as a job condition instead. dev keeps the full gate and pull requests
    # still run it, so a merge is checked exactly as before.
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || !(startsWith(github.ref_name, 'refactor/') || startsWith(github.ref_name, 'feat/'))
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install locked tools only (not the application)
        run: python -m pip install --require-hashes -r .ci/requirements.txt
      - name: Syntax, leaf imports, migration graph, format and secrets ratchet
        run: python -m scripts.ci.checks
      - name: Reviewed offline tests (no project fixtures or plugins)
        run: python -m scripts.ci.run_offline

  vk-journey-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: P8-T41 source-only mocked journey (not DB or live acceptance)
        run: python -m scripts.check_p8_t41
