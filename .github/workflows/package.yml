name: Package contract

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [core, telegram, qr, legacy-celery, dev]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install compiler/build tools only
        run: |
          python -m pip install --require-hashes -r .ci/requirements.txt
          python -m pip install -r requirements/tools.txt
      - name: Verify generated dependency closures
        run: python scripts/packaging/dependencies.py export --check
      - name: Build wheel without importing runtime
        run: python -m build --wheel --outdir dist
      - name: Installed profile and resource smoke (no DB/runtime/provider execution)
        run: python scripts/packaging/verify_profile.py --wheel dist/*.whl --profile '${{ matrix.profile }}'
