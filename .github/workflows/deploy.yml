name: Build and Deploy to VPS

on:
  pull_request:
    branches: [dev, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [dev, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  IMAGE_TAG: ghcr.io/starck43/social-media-ai:sha-${{ github.sha }}

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          cache-from: type=gha

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish commit tag
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: >-
      github.event_name == 'push' &&
      (
        (github.ref == 'refs/heads/dev' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
        (github.ref == 'refs/heads/master' &&
         vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
         vars.PRODUCTION_BACKUP_READY == 'true')
      )
    runs-on: ubuntu-22.04
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR }}
      IMAGE_REF: ghcr.io/starck43/social-media-ai@${{ needs.build-and-push.outputs.image_digest }}
    steps:
      - name: Checkout deployment support files
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Validate SSH configuration and install pinned host key
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_TARGET" == staging || "$DEPLOY_TARGET" == production ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_PORT > 0 && VPS_PORT <= 65535 ))
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/starck43/social-media-ai@sha256:[0-9a-f]{64}$ ]]
          if [[ "$DEPLOY_TARGET" == staging ]]; then
            [[ "$VPS_DEPLOY_DIR" == /opt/social-media-ai/staging ]]
          else
            [[ "$VPS_DEPLOY_DIR" == /opt/social-media-ai/production ]]
          fi
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" >/dev/null

      - name: Transfer reviewed Compose and operations files
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/deployment-support.tar.gz"
          tar -czf "$bundle" docker nginx scripts/ops .env.staging.example .env.production.example
          ssh_opts=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
            -o "Port=$VPS_PORT"
          )
          remote_bundle="/tmp/social-ai-deploy/$GITHUB_SHA.tar.gz"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 /tmp/social-ai-deploy"
          scp "${ssh_opts[@]}" "$bundle" "$VPS_USER@$VPS_HOST:$remote_bundle"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -eu; install -d -m 0750 '$VPS_DEPLOY_DIR'; tar -xzf '$remote_bundle' -C '$VPS_DEPLOY_DIR'; rm -f '$remote_bundle'; APP_IMAGE='$IMAGE_REF' bash '$VPS_DEPLOY_DIR/scripts/ops/deploy_vps.sh' '$DEPLOY_TARGET' '$IMAGE_REF'"