# Isolated single-VPS staging. Use scripts/ops/staging_compose.sh.
# The same-origin web/admin routes are served by the FastAPI API container.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.staging}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-staging} -d $${POSTGRES_DB:-social_ai_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [staging]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [staging]

  api:
    image: ${APP_IMAGE:-social-ai-api:staging-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: "3.14"
    env_file:
      - ../.env.staging
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${NGINX_CONTAINER_IP:-172.30.43.2}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [staging]

  nginx:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
    image: social-ai-api-proxy:staging-local
    ports:
      - "127.0.0.1:18000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      staging:
        ipv4_address: ${NGINX_CONTAINER_IP:-172.30.43.2}

volumes:
  staging_pgdata:

networks:
  staging:
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.43.0/24}
