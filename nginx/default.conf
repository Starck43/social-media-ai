# Container-side proxy for the Python monolith. The host Nginx owns public TLS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $external_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The loopback ingress trusts the host TLS proxy, which overwrites client headers.
# Preserve its client address rather than appending the Docker gateway address.
map $http_x_real_ip $external_client {
    default $http_x_real_ip;
    ''      $remote_addr;
}

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $external_client;
        proxy_set_header X-Forwarded-For $external_client;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
