name = "test-runner"
description = "Codex primary external OpenCode route for assigned tests."
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Read AGENTS.md, the task card and tests/AGENTS.md. Consult COLLABORATION Tests;
Database only for DB work. Record actual docs read/checks.
Load .agents/skills/opencode-task/SKILL.md and .agents/skills/test-runner/SKILL.md.
Route the task to OpenCode build from the target checkout (no --dir); it owns
HEAD/DB/writer preflight and database setup and cleanup. Build invokes the configured
native OpenCode tester in ~/.config/opencode/opencode.jsonc, pinned to
river/deepseek-ai/DeepSeek-V4.1-Flash-1017 in subagent mode. OpenCode V2 build
uses the `subagent` tool; do not use V1 `task` or select the tester as parent
via `--agent`. Do not override its model/mode. It runs only the supplied command, parses output and
returns PASS/FAIL, failing names and root causes; it cannot edit files or add
commands. If OpenCode is unavailable, Codex may use Kilo then its own native
test child. Persist result and delete children after dialogue. No scope expansion.
"""
[sandbox_workspace_write]
network_access = true
writable_roots = ["/Users/admin/.local/share/opencode", "/Users/admin/.config/opencode", "/Users/admin/.npm"]
