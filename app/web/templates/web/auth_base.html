<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Monitor{% endblock %}</title>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/ui.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="ui-shell bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 flex min-h-screen items-center justify-center p-6 antialiased">
<div class="w-full min-w-0 max-w-md">
    <div class="mb-4 flex justify-end">
        <select data-theme-select class="ui-control" aria-label="Тема оформления">
            <option value="light">Светлая</option><option value="dark">Тёмная</option><option value="system">Системная</option>
        </select>
    </div>
    <a href="/app/" class="mb-6 flex items-center justify-center gap-2 text-xl font-semibold tracking-tight">
        <span class="h-2.5 w-2.5 rounded-full bg-cyan-500 dark:bg-cyan-400"></span>
        AI Monitor
    </a>

    {% include "web/_flashes.html" %}

    {% if error is defined and error %}
        <div class="mb-4 rounded-lg border border-rose-600 dark:border-rose-700 bg-rose-50 dark:bg-rose-950/50 px-4 py-2 text-sm text-rose-700 dark:text-rose-200">
            {{ error }}
        </div>
    {% endif %}

    <div class="ui-card p-6">
        <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-100">{% block heading %}{% endblock %}</h1>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">{% block lead %}{% endblock %}</p>
        {% block card %}{% endblock %}
    </div>

    <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">{% block footnote %}{% endblock %}</p>
</div>


</body>
</html>
